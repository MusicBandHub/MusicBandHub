<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MusicBandHub</title>
<style>
:root{--bg:#07070a;--card:#121216;--sf:#0e0e12;--tx:#f2f2f5;--mu:#8e8e99;--ac:#c6ff1a;--ac2:#c6ff1a;--er:#ff5a6a;--ok:#35e0a1;--bd:#23232c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 55% at 100% 0,rgba(124,58,237,.30),transparent 60%),radial-gradient(90% 45% at 0 100%,rgba(34,197,94,.16),transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
#app{max-width:720px;margin:0 auto;padding:12px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:30px;margin:.3em 0}h2{font-size:24px;margin:.5em 0 .2em}h3{font-size:18px;margin:1em 0 .3em}.mu{color:var(--mu);font-size:13px}.er{color:var(--er)}
input,select,textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:5px 0;font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:90px}label.l{font-size:12px;color:var(--mu)}
button,.btn{background:var(--ac);color:#0b0b0d;border:0;border-radius:999px;padding:15px 18px;font:inherit;font-weight:700;width:100%;margin:6px 0;display:block;text-align:center;cursor:pointer}
.g{background:transparent;color:var(--tx);border:1px solid #3a3a46}button.s{width:auto;padding:9px 15px;display:inline-block;margin:3px 4px 3px 0;font-size:14px}
.card{background:linear-gradient(180deg,#15151a,#101014);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:9px 0}
.hero{background:linear-gradient(135deg,#2b0f5c 0%,#5b21b6 55%,#14532d 130%);border-color:#3b2a73}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{display:inline-block;padding:8px 14px;border-radius:99px;background:#17171d;border:1px solid var(--bd);margin:3px 4px 3px 0;font-size:14px;cursor:pointer}.chip.on{background:var(--ac);color:#0b0b0d;border-color:var(--ac);font-weight:700}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));background:rgba(18,18,22,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;display:flex;z-index:5;max-width:700px;margin:0 auto}
nav a{flex:1;text-align:center;padding:9px 0 8px;font-size:10.5px;color:var(--mu);cursor:pointer}nav a svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}nav a.on{color:var(--ac)}nav a.on svg{filter:drop-shadow(0 0 6px rgba(198,255,26,.7))}
#pl{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));background:#17171d;border:1px solid #2f2f3a;border-radius:18px;padding:8px 12px;display:none;z-index:6;max-width:700px;margin:0 auto}
#pl audio{width:100%;height:36px;margin-top:4px}header{display:flex;gap:8px;align-items:center}header select{flex:1;border-radius:99px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--ac);padding:10px 16px;border-radius:99px;z-index:9;display:none;max-width:90%}
.code{font-size:34px;letter-spacing:4px;color:var(--ac);font-weight:800}
.logo{text-align:center;margin:28px 0 8px}.logo svg{width:92px;height:92px;filter:drop-shadow(0 0 14px rgba(124,58,237,.7))}.logo h1{margin:6px 0 2px}.logo p{margin:0;color:var(--mu)}
#eq{display:flex;gap:2px;align-items:flex-end;height:16px}#eq i{width:3px;height:4px;background:var(--ac);border-radius:2px}#eq.on i{animation:eq .9s infinite ease-in-out}
#eq i:nth-child(2){animation-delay:.15s}#eq i:nth-child(3){animation-delay:.3s}#eq i:nth-child(4){animation-delay:.45s}#eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.mt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#17171d;border:1px solid var(--bd);cursor:pointer}
.mt img,.mt video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.pb{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:var(--ac);border-radius:99px;padding:2px 8px;font-size:12px}
</style></head><body>
<div id="app"></div>
<div id="pl"><div style="display:flex;align-items:center;gap:8px"><div id="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="mu" id="pt"></div></div><audio id="au" controls></audio></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const v=id=>document.getElementById(id)?.value??'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRESET={url:'https://jgzzdsittnzomedvsspj.supabase.co',key:'sb_publishable_z40zmd4oAy9jUr3Q4BgDYQ_-IpiIlJe'}; // можно вписать Project URL и anon key, чтобы экран настройки не показывался
let sb=null,S={cfg:(PRESET.url&&PRESET.key)?PRESET:JSON.parse(localStorage.mbh_cfg||'null'),user:null,invAll:[],bands:[],bid:localStorage.mbh_band||null,tab:'home',song:null,reg:false,msg:'',net:navigator.onLine,sync:'',created:null,busy:false,q:'',fs:'',D:{songs:[],drafts:[],rehs:[],att:[],log:[],mem:[],files:[]}};
const ST=['IDEA','DRAFT','ARRANGEMENT','READY','ARCHIVED'],AL={GOING:'Буду',MAYBE:'Возможно',NOT_GOING:'Не смогу'};
const OK_EXT=['mp3','wav','m4a','gp','gp5','pdf','png','jpg','jpeg','mp4'];

const LOGO=`<svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c6ff1a"/><stop offset=".55" stop-color="#34e0a1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M6 46 L18 14 L32 40 L46 14 L58 46" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g stroke="url(#lg)" stroke-width="3" stroke-linecap="round"><path d="M2 32v6M10 26v16M54 26v16M62 32v6"/></g></svg>`;
const IC={home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',songs:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',drafts:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',rehs:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',media:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',mem:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function err(e){const m=(e&&e.message)||String(e);
 if(!navigator.onLine||/fetch|network/i.test(m))return'Нет соединения';
 if(/invalid_invite_code/.test(m))return'Неверный код приглашения';
 if(/Invalid login/i.test(m))return'Неверный email или пароль';
 if(/already registered/i.test(m))return'Этот email уже зарегистрирован';
 if(/JWT|expired/i.test(m))return'Сессия истекла, войдите снова';
 if(/check constraint/i.test(m))return'Недопустимое значение';
 if(/row-level security/i.test(m))return'Недостаточно прав';
 return'Ошибка: '+m.slice(0,80)}
const nm=id=>S.D.mem.find(m=>m.user_id===id)?.profiles?.display_name||'—';
const band=()=>S.bands.find(b=>b.id===S.bid);
const myRole=()=>S.D.mem.find(m=>m.user_id===S.user?.id)?.role;
const isAdm=()=>['OWNER','ADMIN'].includes(myRole());
const dt=s=>(s||'').slice(0,16).replace('T',' ');
function desc(a){const w=nm(a.user_id),n=a.new_value||'';
 return({'song.created':`${w} добавил песню «${n}»`,'song.bpm_changed':`${w} изменил BPM: ${a.old_value} → ${n}`,'song.lyrics_changed':`${w} изменил текст`,'song.chords_changed':`${w} изменил аккорды`,'song.status_changed':`${w} изменил статус: ${a.old_value} → ${n}`,'media.media_added':`${w} добавил в медиа: ${n}`,'file.file_added':`${w} добавил файл: ${n}`,'rehearsal.created':`${w} создал репетицию ${n}`,'rehearsal.updated':`${w} изменил репетицию ${n}`,'member.joined':`${w} вступил в группу`})[a.entity_type+'.'+a.action]||`${w}: ${a.action}`}

/* ---------- data ---------- */
const t=q=>q.then(r=>{if(r.error)throw r.error;return r.data});
async function loadInv(){try{S.invAll=await t(sb.from('invitations').select('*').order('created_at',{ascending:false}));draw()}catch(e){}}
function subInv(){unsubInv();if(!S.user)return;S.ich=sb.channel('inv-'+S.user.id+'-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'invitations'},()=>{clearTimeout(S.ti);S.ti=setTimeout(loadInv,250)}).subscribe()}
function unsubInv(){if(S.ich){sb.removeChannel(S.ich);S.ich=null}}
const myEmail=()=>(S.user?.email||'').toLowerCase();
function invBanner(){return S.invAll.filter(x=>x.email===myEmail()).map(i=>`<div class=card style="border:1px solid var(--ac)"><b>Приглашение в группу «${esc(i.band_name)}»</b><div class=mu>от ${esc(i.inviter_name)}</div><div class=row><button class=s data-a=accept data-id=${i.id}>Принять</button><button class="s g" data-a=decline data-id=${i.id}>Отклонить</button></div></div>`).join('')}
async function loadBands(){
 try{subInv();await loadInv();const r=await t(sb.from('band_members').select('bands(*)').eq('user_id',S.user.id));
  S.bands=r.map(x=>x.bands).filter(Boolean);
  if(S.bands.length&&!band()){S.bid=S.bands[0].id;localStorage.mbh_band=S.bid}
  if(!S.bands.length)S.bid=null;
  sub();await load()}catch(e){S.msg=err(e)}
 draw(true)}
async function load(){const b=S.bid;if(!b)return;
 try{const[songs,drafts,rehs,att,log,mem,files,media]=await Promise.all([
  t(sb.from('songs').select('*').eq('band_id',b).order('updated_at',{ascending:false})),
  t(sb.from('drafts').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('rehearsals').select('*').eq('band_id',b).order('date')),
  t(sb.from('rehearsal_attendees').select('*')),
  t(sb.from('activity_log').select('*').eq('band_id',b).order('created_at',{ascending:false}).limit(60)),
  t(sb.from('band_members').select('*,profiles(display_name)').eq('band_id',b)),
  t(sb.from('song_files').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('media').select('*').eq('band_id',b).order('created_at',{ascending:false})).catch(()=>[])]);
  if(b!==S.bid)return;S.D={songs,drafts,rehs,att,log,mem,files,media};draw()}catch(e){toast(err(e))}}
function unsub(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}}
function sub(){unsub();if(!S.bid)return;const b=S.bid,ch=sb.channel('band-'+b+'-'+Date.now());
 const deb=()=>{clearTimeout(S.tm);S.tm=setTimeout(load,250)};
 ['songs','drafts','rehearsals','activity_log','band_members','song_files','media'].forEach(table=>ch.on('postgres_changes',{event:'*',schema:'public',table,filter:'band_id=eq.'+b},deb));
 ch.on('postgres_changes',{event:'*',schema:'public',table:'rehearsal_attendees'},deb);
 ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'bands',filter:'id=eq.'+b},()=>{clearTimeout(S.tb);S.tb=setTimeout(loadBands,300)});
 ch.subscribe(s=>{S.sync=s==='SUBSCRIBED'?'ok':'bad';draw()});S.ch=ch}
addEventListener('online',()=>{S.net=true;sub();load();draw()});addEventListener('offline',()=>{S.net=false;draw()});

/* ---------- views ---------- */
function draw(force){
 const a=document.activeElement;
 if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'){S.dirty=true;return}
 S.dirty=false;
 const el=document.getElementById('app');
 el.innerHTML=!S.cfg?setupV():!S.user?authV():(!S.bands.length||S.gate)?gateV():shellV();
 document.getElementById('pl').style.bottom=S.user&&S.bands.length?'':'0'}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty)draw()},150));

function setupV(){return`<h1>MusicBandHub</h1><p class=mu>Один раз укажите данные вашего Supabase-проекта (Project Settings → API). Они хранятся только в этом браузере. Используйте только anon/publishable ключ.</p>
<input id=cu placeholder="https://xxxx.supabase.co"><input id=ck placeholder="anon / publishable key"><button data-a=cfg>Сохранить</button>`}
function authV(){return`<div class=logo>${LOGO}<h1>MusicBandHub</h1><p>Твоя музыкальная вселенная</p></div>
<form id=af autocomplete=on><input id=an name=name autocomplete=name placeholder="Имя пользователя" value="${esc(S.f?.n)}"><input id=ae name=email type=email autocomplete=username placeholder="Email" value="${esc(S.f?.e)}"><input id=ap name=password type=password autocomplete=current-password placeholder="Пароль (от 6 символов)">
<div class=er>${esc(S.msg)}</div><button type=submit ${S.busy?'disabled':''}>Зарегистрироваться</button></form>${S.noStore?'<p class=er>Браузер не сохраняет данные входа. Откройте приложение по ссылке в Safari или Chrome, а не внутри другого приложения.</p>':''}<p class=mu style="text-align:center;margin-top:24px">Продолжая, вы соглашаетесь с условиями использования</p>`}
function gateV(){const c=S.created;
 if(c)return`<h2>Группа создана!</h2><div class=mu>Invite code:</div><div class=code>${esc(c.invite_code)}</div>
 <button data-a=copy data-c="${esc(c.invite_code)}">Скопировать код</button><button class=g data-a=share data-c="${esc(c.invite_code)}" data-n="${esc(c.name)}">Поделиться кодом</button><button data-a=opened>Открыть группу</button>`;
 return`${invBanner()}${S.bands.length?'<button class="g s" data-a=gateback>← Назад</button>':''}<h2>${S.bands.length?'Новая группа':'Ваша группа'}</h2><input id=gn placeholder="Название группы"><input id=gd placeholder="Описание"><button data-a=mkband>Создать группу</button>
 <h3>Или вступить</h3><input id=gc placeholder="Введите код"><button class=g data-a=join>Вступить</button><div class=er>${esc(S.msg)}</div><button class="g s" data-a=signout>Выйти</button>`}
function shellV(){
 const st=!S.net?'<span class=er>Нет соединения · Offline</span>':S.sync==='ok'?'<span style=color:var(--ok)>Синхронизировано</span>':'Синхронизация...';
 const T=[['home','Главная'],['songs','Песни'],['drafts','Черновики'],['media','Медиа'],['rehs','Репетиции'],['mem','Участники']];
 return`<header><select data-ch=band>${S.bands.map(b=>`<option value=${b.id} ${b.id===S.bid?'selected':''}>▼ ${esc(b.name)}</option>`).join('')}<option value=__new>＋ Новая группа</option></select><button class="g s" data-a=signout>Выйти</button></header>
 <div class=mu>${st}</div>${invBanner()}${S.tab==='home'?homeV():S.tab==='songs'?(S.song?songV():songsV()):S.tab==='drafts'?draftsV():S.tab==='media'?mediaV():S.tab==='rehs'?rehsV():memV()}
 <nav>${T.map(([k,l])=>`<a class="${S.tab===k?'on':''}" data-a=tab data-k=${k}>${ic(k)}${l}</a>`).join('')}</nav>${lbV()}`}
const rehForm=r=>`<div class=card><input id=et value="${esc(r.title)}"><input id=ed type=date value="${r.date}"><div class=row><input id=es type=time value="${r.start_time.slice(0,5)}"><input id=ee type=time value="${(r.end_time||'').slice(0,5)}"></div><input id=el placeholder="Место" value="${esc(r.location)}"><textarea id=en placeholder="Заметки">${esc(r.notes)}</textarea><button data-a=savereh data-id=${r.id}>Сохранить</button><button class=g data-a=cancel>Отмена</button></div>`;
const draftForm=d=>`<div class=card><input id=xt value="${esc(d.title)}"><textarea id=xd>${esc(d.description)}</textarea><select id=xy>${['IDEA','TEXT','RIFF','LINK','DEMO','VIDEO','IMAGE','FILE'].map(x=>`<option ${x===d.type?'selected':''}>${x}</option>`).join('')}</select><select id=xs><option value="">Без привязки к песне</option>${S.D.songs.map(s=>`<option value=${s.id} ${d.song_id===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select><button data-a=savedraft data-id=${d.id}>Сохранить</button><button class=g data-a=cancel>Отмена</button></div>`;
const IMGX=['jpg','jpeg','png','webp','heic','gif'],VIDX=['mp4','mov','m4v','webm'],CATS=[['concert_photo','Фото концертов','image'],['rehearsal_photo','Фото с репетиций','image'],['concert_video','Видео с концертов','video'],['rehearsal_video','Видео с репетиций','video'],['clips','Клипы группы','video']],CAT=()=>{const c=CATS.find(x=>x[0]===S.mc)||CATS[0];return{id:c[0],l:c[1],k:c[2]}};
const MEXT=['jpg','jpeg','png','webp','heic','gif','mp4','mov','m4v','webm'],MMAX=50*1048576;
async function fillUrls(list){const need=list.filter(m=>!(m.id in S.urls));if(!need.length||S.fu)return;S.fu=true;
 try{const r=await sb.storage.from('band-files').createSignedUrls(need.map(m=>m.storage_path),43200);if(r.error)throw r.error;r.data.forEach((x,i)=>{S.urls[need[i].id]=x.signedUrl||null})}catch(e){S.fu=false;return}
 S.fu=false;if(S.tab==='media')draw(true)}
function mediaV(){const all=S.D.media||[],c=CAT(),l=all.filter(m=>m.category===c.id),vis=l.slice(0,S.mn);fillUrls(vis);
 return`<h2>Медиа</h2><div style="overflow-x:auto;white-space:nowrap;padding-bottom:4px">${CATS.map(x=>`<span class="chip ${x[0]===c.id?'on':''}" data-a=mf data-k=${x[0]}>${x[1]} (${all.filter(m=>m.category===x[0]).length})</span>`).join('')}</div>
 <label class="btn">${S.busy?'Загрузка…':'⬆ Добавить: '+c.l}<input type=file id=mu accept="${c.k==='image'?'image/*':'video/*'}" multiple hidden ${S.busy?'disabled':''}></label>
 <div class=mg>${vis.map(m=>{const u=S.urls[m.id];return`<div class=mt data-a=lb data-id=${m.id}>${u?(m.kind==='video'?`<video src="${u}#t=0.1" preload=metadata muted playsinline></video><span class=pb>▶</span>`:`<img src="${u}" loading=lazy alt="">`):''}</div>`}).join('')}</div>
 ${l.length>S.mn?'<button class=g data-a=more>Показать ещё</button>':''}${!l.length?`<p class=mu>В разделе «${c.l}» пока пусто.</p>`:''}<p class=mu>Файлы до 50 МБ. ${c.k==='image'?'JPG, PNG, WEBP, HEIC, GIF.':'MP4, MOV, WEBM.'}</p>`}
function lbV(){const m=(S.D.media||[]).find(x=>x.id===S.lb);if(!m)return'';const u=S.urls[m.id];if(!u)return'';
 return`<div style="position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))"><div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">${m.kind==='video'?`<video src="${u}" controls autoplay playsinline style="max-width:100%;max-height:100%"></video>`:`<img src="${u}" style="max-width:100%;max-height:100%" alt="">`}</div>
