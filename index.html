function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function err(e){const m=(e&&e.message)||String(e);
 if(!navigator.onLine||/fetch|network/i.test(m))return'Нет соединения';
 if(/invalid_invite_code/.test(m))return'Неверный код группы';
 if(/already_member/.test(m))return'Вы уже состоите в этой группе';
 if(/Invalid login/i.test(m))return'Неверный email или пароль';
 if(/already registered/i.test(m))return'Этот email уже зарегистрирован';
 if(/JWT|expired/i.test(m))return'Сессия истекла, войдите снова';
 if(/check constraint/i.test(m))return'Недопустимое значение';
 if(/row-level security/i.test(m))return'Недостаточно прав';
 return'Ошибка: '+m.slice(0,80)}
const nm=id=>S.D.mem.find(m=>m.user_id===id)?.profiles?.display_name||'—';
const band=()=>S.bands.find(b=>b.id===S.bid);
const myRole=()=>S.D.mem.find(m=>m.user_id===S.user?.id)?.role;
const isAdm=()=>['OWNER','ADMIN'].includes(myRole());
const dt=s=>(s||'').slice(0,16).replace('T',' ');
function desc(a){const w=nm(a.user_id),n=a.new_value||'';
 return({'song.created':`${w} добавил песню «${n}»`,'song.bpm_changed':`${w} изменил BPM: ${a.old_value} → ${n}`,'song.lyrics_changed':`${w} изменил текст`,'song.chords_changed':`${w} изменил аккорды`,'song.status_changed':`${w} изменил статус: ${a.old_value} → ${n}`,'media.media_added':`${w} добавил в медиа: ${n}`,'file.file_added':`${w} добавил файл: ${n}`,'rehearsal.created':`${w} создал репетицию ${n}`,'rehearsal.updated':`${w} изменил репетицию ${n}`,'member.joined':`${w} вступил в группу`})[a.entity_type+'.'+a.action]||`${w}: ${a.action}`}

/* ---------- data ---------- */
const t=q=>q.then(r=>{if(r.error)throw r.error;return r.data});
async function loadInv(){try{S.invAll=await t(sb.from('invitations').select('*').order('created_at',{ascending:false}));try{S.reqs=await t(sb.from('join_requests').select('*'))}catch(e){S.reqs=[]}draw()}catch(e){}}
function subInv(){unsubInv();if(!S.user)return;S.ich=sb.channel('inv-'+S.user.id+'-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'invitations'},()=>{clearTimeout(S.ti);S.ti=setTimeout(loadInv,250)}).on('postgres_changes',{event:'*',schema:'public',table:'join_requests'},()=>{clearTimeout(S.tr);S.tr=setTimeout(loadBands,400)}).subscribe()}
function unsubInv(){if(S.ich){sb.removeChannel(S.ich);S.ich=null}}
const myEmail=()=>(S.user?.email||'').toLowerCase();
function invBanner(){return S.invAll.filter(x=>x.email===myEmail()).map(i=>`<div class=card style="border:1px solid var(--ac)"><b>Приглашение в группу «${esc(i.band_name)}»</b><div class=mu>от ${esc(i.inviter_name)} · Роль: Участник</div><div class=row><button class=s data-a=accept data-id=${i.id}>Принять</button><button class="s g" data-a=decline data-id=${i.id}>Отклонить</button></div></div>`).join('')}
async function loadBands(){
 try{subInv();await loadInv();const r=await t(sb.from('band_members').select('role,bands(*)').eq('user_id',S.user.id));
  S.bands=r.map(x=>x.bands).filter(Boolean);S.roles={};r.forEach(x=>{if(x.bands)S.roles[x.bands.id]=x.role});
  if(S.bands.length&&!band()){S.bid=S.bands[0].id;localStorage.mbh_band=S.bid}
  if(!S.bands.length)S.bid=null;try{localStorage.mbh_bn=band()?.name||''}catch(e){}
  sub();await load()}catch(e){S.msg=err(e)}
 draw(true)}
async function load(){const b=S.bid;if(!b)return;
 try{const[songs,drafts,rehs,att,log,mem,files,media,dfiles]=await Promise.all([
  t(sb.from('songs').select('*').eq('band_id',b).order('updated_at',{ascending:false})),
  t(sb.from('drafts').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('rehearsals').select('*').eq('band_id',b).order('date')),
  t(sb.from('rehearsal_attendees').select('*')),
  t(sb.from('activity_log').select('*').eq('band_id',b).order('created_at',{ascending:false}).limit(60)),
  t(sb.from('band_members').select('*,profiles(display_name)').eq('band_id',b)),
  t(sb.from('song_files').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('media').select('*').eq('band_id',b).order('created_at',{ascending:false})).catch(()=>[]),
  t(sb.from('draft_files').select('*').eq('band_id',b).order('created_at',{ascending:true})).catch(()=>[])]);
  if(b!==S.bid)return;S.D={songs,drafts,rehs,att,log,mem,files,media,dfiles};draw()}catch(e){toast(err(e))}}
function unsub(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}}
function sub(){unsub();if(!S.bid)return;const b=S.bid,ch=sb.channel('band-'+b+'-'+Date.now());
 const deb=()=>{clearTimeout(S.tm);S.tm=setTimeout(load,250)};
 ['songs','drafts','rehearsals','activity_log','band_members','song_files','media','draft_files'].forEach(table=>ch.on('postgres_changes',{event:'*',schema:'public',table,filter:'band_id=eq.'+b},deb));
 ch.on('postgres_changes',{event:'*',schema:'public',table:'rehearsal_attendees'},deb);
 ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'bands',filter:'id=eq.'+b},()=>{clearTimeout(S.tb);S.tb=setTimeout(loadBands,300)});
 ch.subscribe(s=>{S.sync=s==='SUBSCRIBED'?'ok':'bad';draw()});S.ch=ch}
addEventListener('online',()=>{S.net=true;sub();load();draw()});addEventListener('offline',()=>{S.net=false;draw()});

async function hydrateSongCovers(){for(const el of document.querySelectorAll('[data-cover-id]')){const id=el.dataset.coverId;if(!id)continue;const f=S.D.files.find(x=>x.id===id);if(!f)continue;try{const r=await sb.storage.from('band-files').createSignedUrl(f.storage_path,3600);if(r.data?.signedUrl)el.innerHTML='<img src="'+r.data.signedUrl+'" alt="Обложка">'}catch(e){}}for(const el of document.querySelectorAll('[data-song-audio]')){const f=S.D.files.find(x=>x.id===el.dataset.songAudio);if(!f)continue;try{const r=await sb.storage.from('band-files').createSignedUrl(f.storage_path,3600);if(r.data?.signedUrl)el.src=r.data.signedUrl}catch(e){}}}
function draw(force){
 const a=document.activeElement;
 if(!force&&S.ma&&S.ma.s===3){S.dirty=true;return}
 if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'){S.dirty=true;return}
 S.dirty=false;
 const el=document.getElementById('app');
 el.innerHTML=S.locked?lockV():!S.cfg?setupV():!S.user?authV():(!S.bands.length||S.gate)?gateV():shellV();
 syncPlay();const player=document.getElementById('pl');if(player){if(S.tab==='home'){const audio=document.getElementById('au');if(audio){audio.pause();audio.currentTime=0}player.style.display='none';PLAY.id=null}else{player.style.bottom=S.user&&S.bands.length?'':'0'}}if(S.user&&S.bands.length)setTimeout(hydrateSongCovers,0)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty)draw()},150));

function setupV(){return`<h1>MusicBandHub</h1><p class=mu>Один раз укажите данные вашего Supabase-проекта (Project Settings → API). Они хранятся только в этом браузере. Используйте только anon/publishable ключ.</p>
<input id=cu placeholder="https://xxxx.supabase.co"><input id=ck placeholder="anon / publishable key"><button data-a=cfg>Сохранить</button>`}
function authV(){return`<div class=logo>${LOGO}<h1>MusicBandHub</h1><p>Твоя музыкальная вселенная</p></div>
<form id=af autocomplete=on><input id=an name=name autocomplete=name placeholder="Имя пользователя" value="${esc(S.f?.n)}"><input id=ae name=email type=email autocomplete=username placeholder="Email" value="${esc(S.f?.e)}"><input id=ap name=password type=password autocomplete=current-password placeholder="Пароль (от 6 символов)">
<div class=er>${esc(S.msg)}</div><button type=submit ${S.busy?'disabled':''}>Создать аккаунт</button></form>${S.noStore?'<p class=er>Браузер не сохраняет данные входа. Откройте приложение по ссылке в Safari или Chrome, а не внутри другого приложения.</p>':''}<p class=mu style="text-align:center;margin-top:24px">Продолжая, вы соглашаетесь с условиями использования</p>`}
function gateV(){const c=S.created,gm=S.bands.length?S.gm:'both';
 if(c)return`<h2>Группа создана!</h2><div class=mu>Вы стали 👑 Owner. Код группы:</div><div class=code>${esc(c.invite_code)}</div>
 <button data-a=copy data-c="${esc(c.invite_code)}">Скопировать код</button><button class=g data-a=share data-c="${esc(c.invite_code)}" data-n="${esc(c.name)}">Поделиться кодом</button><button data-a=opened>Открыть группу</button>`;

const SIGD={'2/4':[2],'3/4':[3],'4/4':[4],'5/4':[3,2],'6/8':[3,3],'7/8':[2,2,3],'9/8':[3,3,3],'12/8':[3,3,3,3]};
function parseSig(s){const m=String(s||'4/4').trim().match(/^(\d+)\/(\d+)(?:\s*\(?([\d+]+)\)?)?$/);if(!m)return{n:4,groups:[4],label:'4/4'};const n=+m[1];let g=m[3]?m[3].split('+').map(Number).filter(x=>x>0):(SIGD[m[1]+'/'+m[2]]||[n]);if(g.reduce((a,b)=>a+b,0)!==n)g=[n];return{n,groups:g,label:m[1]+'/'+m[2]+(m[3]?' ('+g.join('+')+')':'')}}

function mLevel(i,p){const m=MET.accent;if(m==='none')return 0;if(i===0)return 2;if(m==='first')return 0;if(m==='two')return(p.n>=4&&i===Math.floor(p.n/2))?1:0;if(m==='groups'){let s=0;for(const g of p.groups){if(i===s)return 1;s+=g}}return 0}
