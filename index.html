<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MusicBandHub</title>
<style>
:root{--bg:#090a0d;--surface:#111318;--surface2:#171a20;--line:#272c35;--text:#f4f5f7;--muted:#7f8794;--lime:#c8ff20;--green:#35e0a1;--violet:#8b5cf6;--red:#ff5d6c;--r:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:linear-gradient(180deg,#090a0d 0%,#0b0c10 55%,#090a0d 100%)}
body:before{display:none!important}#app{width:min(1180px,100%);max-width:none;margin:auto;padding:28px 28px 120px}
h1{font-size:38px;line-height:1.02;letter-spacing:-1.8px!important;margin:0}h2{font-size:24px;letter-spacing:-.8px!important;margin:0}h3{font-size:16px}.mu{color:var(--muted);font-size:12px;line-height:1.45}.sec{margin:30px 0 10px;color:#747d8b;font-size:10px;font-weight:850;letter-spacing:1.9px;text-transform:uppercase}
.card{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:var(--r)!important;box-shadow:none!important;padding:18px;margin:10px 0}.hero{background:#15191a!important;border-color:#343c29!important}
button,.btn{min-height:42px;border:1px solid transparent;border-radius:10px!important;padding:10px 14px;font-weight:800!important;box-shadow:none!important}button:not(.g):not(.chip):not(.s),.btn:not(.g){background:var(--lime)!important;color:#080a0b!important}button.g,.btn.g,.g{background:#181b21!important;color:#edf0f4!important;border-color:#303640!important}button.s{min-height:34px;padding:7px 10px!important}
input,select,textarea{background:#0c0e12!important;color:var(--text)!important;border:1px solid #2b3039!important;border-radius:10px!important;padding:11px 12px!important}input:focus,select:focus,textarea:focus{outline:none;border-color:#91b91b!important;box-shadow:none!important}
.chip{display:inline-flex;align-items:center;background:#191c22!important;border:1px solid #30353f!important;color:#c7ccd5!important;border-radius:999px!important;padding:7px 10px!important;font-size:11px;font-weight:750}.chip.on{background:var(--lime)!important;color:#080a0b!important;border-color:var(--lime)!important}
nav{position:fixed!important;z-index:100;left:50%!important;right:auto!important;bottom:16px!important;transform:translateX(-50%);width:min(620px,calc(100% - 28px));height:58px;padding:5px;background:#111318!important;border:1px solid #30353f!important;border-radius:16px!important;box-shadow:0 18px 50px rgba(0,0,0,.55)!important;display:flex!important}
nav a{flex:1;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#737b88!important;font-size:9px!important;font-weight:750!important;border-radius:11px;text-decoration:none}nav a svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}nav a.on{background:#1c2117!important;color:var(--lime)!important}
#pl{bottom:84px!important;width:min(760px,calc(100% - 28px));background:#12151a!important;border:1px solid #303640!important;border-radius:16px!important}
.st,.dash{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.st .sc,.dash .sc{min-height:76px;padding:12px;background:#11141a!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:none!important}.st .sc b,.dash .sc b{font-size:23px}.st .sc span,.dash .sc span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.ai-card{background:#12141a!important;border:1px solid #38334d!important;box-shadow:none!important}.meter{height:7px;background:#292e35!important;border-radius:99px;overflow:hidden}.meter i{background:var(--lime)!important;box-shadow:none!important}
.badge,.rb{background:#191c22!important;border:1px solid #30353f!important}.song-card{background:#111318!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:none!important}.song-cover{border-radius:10px!important}.song-title{font-weight:800}.playb,.song-play{background:var(--lime)!important;color:#080a0b!important;border-radius:50%!important}
.hn,.sh{background:#101318!important;border-color:#2c323c!important}.ov{backdrop-filter:blur(8px)}
.home-top{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid #20242c}.brand-mark{width:38px;height:38px;padding:6px;border:1px solid #303640;border-radius:10px;background:#12151a}.brand-mark svg{width:100%;height:100%}.brand-copy{flex:1;display:flex;flex-direction:column;gap:2px}.brand-copy b{font-size:13px}.brand-copy span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.icon-btn{width:38px!important;padding:0!important}
.home-greeting{padding:34px 0 24px}.home-greeting .eyebrow{color:var(--lime)}.eyebrow{font-size:9px;letter-spacing:1.8px;font-weight:850;color:#737b87;margin-bottom:9px}.home-greeting p{color:var(--muted);font-size:13px;margin:8px 0 0}
.home-hero{padding:22px;border:1px solid #30382a;border-radius:18px;background:linear-gradient(135deg,#151a17,#111318)}.hero-line>div:first-child{display:flex;justify-content:space-between;align-items:center}.hero-line strong{font-size:14px}.hero-line em{font-style:normal;color:var(--lime);font-size:28px;font-weight:900}.hero-line>span{font-size:11px;color:var(--muted)}.progress{height:6px;background:#2a2f32;border-radius:99px;margin:12px 0 8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--lime);border-radius:99px}.home-stats,.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}.home-stat{min-height:64px;padding:10px;border:1px solid #292e37;border-radius:11px;background:#101318;display:flex;flex-direction:column;justify-content:center}.home-stat strong{font-size:20px}.home-stat span{font-size:9px;color:var(--muted);margin-top:4px}
.ai-home{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid #373149;border-radius:16px;background:#12141a}.ai-orb{width:44px;height:44px;display:grid;place-items:center;border-radius:11px;background:#8b5cf6;color:#fff;font-size:12px;font-weight:950}.ai-copy{flex:1;display:flex;flex-direction:column;gap:3px}.ai-copy>b{font-size:15px}.ai-copy>span{font-size:11px;color:var(--muted)}.ai-actions{margin-top:7px}
.today-card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#111318}.today-main{display:flex;align-items:center;gap:12px;flex:1}.today-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#1b1e24}.today-main div{display:flex;flex-direction:column;gap:3px}.today-main b{font-size:13px}.today-main span:not(.today-icon){font-size:10px;color:var(--muted)}
.home-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.home-action{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:13px;background:#111318;cursor:pointer}.home-action span{font-size:19px}.home-action b{font-size:10px}
.task-card,.songs-progress{padding:4px 14px;background:#111318;border:1px solid var(--line);border-radius:14px}.task-row,.song-progress-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #242932;cursor:pointer}.task-row:last-child,.song-progress-row:last-child{border-bottom:0}.task-row b{flex:1;font-size:12px}.task-row i{font-style:normal;color:#6f7784}.continue-card{display:flex;align-items:center;gap:12px;padding:14px;background:#111318;border:1px solid var(--line);border-radius:13px;margin:7px 0;cursor:pointer}.continue-card div{flex:1;display:flex;flex-direction:column;gap:3px}.continue-card small{color:var(--muted);font-size:10px}.continue-card>strong{color:var(--lime)}.song-progress-row>span{width:100px;font-size:11px}.song-progress-row>i{height:5px;flex:1;background:#292e35;border-radius:99px;overflow:hidden}.song-progress-row>i em{display:block;height:100%;background:var(--lime)}.all-link{padding:12px 0;color:var(--lime);font-size:11px;font-weight:800;cursor:pointer}
@media(max-width:700px){#app{padding:14px 12px 105px}.home-stats,.month-grid{grid-template-columns:repeat(3,1fr)}.st,.dash{grid-template-columns:repeat(3,1fr)}h1{font-size:31px}.card{padding:15px}.home-greeting{padding:28px 0 20px}}
@media(max-width:420px){.home-actions{grid-template-columns:repeat(2,1fr)}.home-action{height:68px}.today-card{align-items:flex-start;flex-wrap:wrap}.today-card>button{width:100%}.home-hero{padding:16px}}
</style></head><body>
<div id="splash"></div>
<div id="app"></div>
<div id="pl" class="mbh-player">
 <div class="mbh-p-top"><div class="mbh-p-disc"><div class="mbh-p-disc-in">♪</div></div><div class="mbh-p-info"><div class="mbh-p-kicker">NOW PLAYING</div><div id="pt" class="mbh-p-title">MusicBandHub</div><div id="pf" class="mbh-p-file">—</div></div><button class="mbh-p-x" data-pact="close" aria-label="Закрыть">×</button></div>
 <div class="mbh-p-wave" id="pwave"></div>
 <div class="mbh-p-seek"><span id="pcur">00:00</span><input id="pseek" type="range" min="0" max="1000" value="0" step="1" aria-label="Позиция"><span id="pdur">00:00</span></div>
 <div class="mbh-p-controls"><button data-pact="back10">↶10</button><button class="mbh-p-play" data-pact="toggle" id="pplay">▶</button><button data-pact="fwd10">10↷</button></div>
 <div class="mbh-p-tools"><button data-pact="loop" id="ploop">↻</button><button data-pact="speed" id="pspeed">1×</button><span class="mbh-p-vol">🔊 <input id="pvol" type="range" min="0" max="1" value="1" step="0.01"></span><button data-pact="next" title="Следующий трек">›</button></div>
 <audio id="au" preload="metadata"></audio>
</div>
<div id="mo" class="pan"></div><div id="ro" class="pan"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const v=id=>document.getElementById(id)?.value??'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRESET={url:'https://jgzzdsittnzomedvsspj.supabase.co',key:'sb_publishable_z40zmd4oAy9jUr3Q4BgDYQ_-IpiIlJe'}; // можно вписать Project URL и anon key, чтобы экран настройки не показывался
let sb=null,S={cfg:(PRESET.url&&PRESET.key)?PRESET:JSON.parse(localStorage.mbh_cfg||'null'),user:null,invAll:[],bands:[],bid:localStorage.mbh_band||null,tab:'home',song:null,reg:false,msg:'',net:navigator.onLine,sync:'',created:null,busy:false,q:'',fs:'',D:{songs:[],drafts:[],rehs:[],att:[],log:[],mem:[],files:[]}};
const ST=['IDEA','DRAFT','ARRANGEMENT','READY','ARCHIVED'],AL={GOING:'Буду',MAYBE:'Возможно',NOT_GOING:'Не смогу'};
const OK_EXT=['mp3','wav','m4a','ogg','gp','gp5','pdf','txt','png','jpg','jpeg','mp4'];

const LOGO=`<svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c6ff1a"/><stop offset=".55" stop-color="#34e0a1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M6 46 L18 14 L32 40 L46 14 L58 46" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g stroke="url(#lg)" stroke-width="3" stroke-linecap="round"><path d="M2 32v6M10 26v16M54 26v16M62 32v6"/></g></svg>`;
const IC={home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',songs:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',drafts:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',rehs:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',files:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',media:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',mem:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function err(e){const m=(e&&e.message)||String(e);
 if(!navigator.onLine||/fetch|network/i.test(m))return'Нет соединения';
 if(/invalid_invite_code/.test(m))return'Неверный код группы';
 if(/already_member/.test(m))return'Вы уже состоите в этой группе';
 if(/Invalid login/i.test(m))return'Неверный email или пароль';
 if(/already registered/i.test(m))return'Этот email уже зарегистрирован';
 if(/JWT|expired/i.test(m))return'Сессия истекла, войдите снова';
 if(/check constraint/i.test(m))return'Недопустимое значение';
 if(/row-level security/i.test(m))return'Недостаточно прав';
 return'Ошибка: '+m.slice(0,80)}
const nm=id=>S.D.mem.find(m=>m.user_id===id)?.profiles?.display_name||'—';
const band=()=>S.bands.find(b=>b.id===S.bid);
const myRole=()=>S.D.mem.find(m=>m.user_id===S.user?.id)?.role;
const isAdm=()=>['OWNER','ADMIN'].includes(myRole());
const dt=s=>(s||'').slice(0,16).replace('T',' ');
function desc(a){const w=nm(a.user_id),n=a.new_value||'';
 return({'song.created':`${w} добавил песню «${n}»`,'song.bpm_changed':`${w} изменил BPM: ${a.old_value} → ${n}`,'song.lyrics_changed':`${w} изменил текст`,'song.chords_changed':`${w} изменил аккорды`,'song.status_changed':`${w} изменил статус: ${a.old_value} → ${n}`,'media.media_added':`${w} добавил в медиа: ${n}`,'file.file_added':`${w} добавил файл: ${n}`,'rehearsal.created':`${w} создал репетицию ${n}`,'rehearsal.updated':`${w} изменил репетицию ${n}`,'member.joined':`${w} вступил в группу`})[a.entity_type+'.'+a.action]||`${w}: ${a.action}`}

/* ---------- data ---------- */
const t=q=>q.then(r=>{if(r.error)throw r.error;return r.data});
async function loadInv(){try{S.invAll=await t(sb.from('invitations').select('*').order('created_at',{ascending:false}));try{S.reqs=await t(sb.from('join_requests').select('*'))}catch(e){S.reqs=[]}draw()}catch(e){}}
function subInv(){unsubInv();if(!S.user)return;S.ich=sb.channel('inv-'+S.user.id+'-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'invitations'},()=>{clearTimeout(S.ti);S.ti=setTimeout(loadInv,250)}).on('postgres_changes',{event:'*',schema:'public',table:'join_requests'},()=>{clearTimeout(S.tr);S.tr=setTimeout(loadBands,400)}).subscribe()}
function unsubInv(){if(S.ich){sb.removeChannel(S.ich);S.ich=null}}
const myEmail=()=>(S.user?.email||'').toLowerCase();
function invBanner(){return S.invAll.filter(x=>x.email===myEmail()).map(i=>`<div class=card style="border:1px solid var(--ac)"><b>Приглашение в группу «${esc(i.band_name)}»</b><div class=mu>от ${esc(i.inviter_name)} · Роль: Участник</div><div class=row><button class=s data-a=accept data-id=${i.id}>Принять</button><button class="s g" data-a=decline data-id=${i.id}>Отклонить</button></div></div>`).join('')}
async function loadBands(){
 try{subInv();await loadInv();const r=await t(sb.from('band_members').select('role,bands(*)').eq('user_id',S.user.id));
  S.bands=r.map(x=>x.bands).filter(Boolean);S.roles={};r.forEach(x=>{if(x.bands)S.roles[x.bands.id]=x.role});
  if(S.bands.length&&!band()){S.bid=S.bands[0].id;localStorage.mbh_band=S.bid}
  if(!S.bands.length)S.bid=null;try{localStorage.mbh_bn=band()?.name||''}catch(e){}
  sub();await load()}catch(e){S.msg=err(e)}
 draw(true)}
async function load(){const b=S.bid;if(!b)return;
 try{const[songs,drafts,rehs,att,log,mem,files,media,dfiles]=await Promise.all([
  t(sb.from('songs').select('*').eq('band_id',b).order('updated_at',{ascending:false})),
  t(sb.from('drafts').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('rehearsals').select('*').eq('band_id',b).order('date')),
  t(sb.from('rehearsal_attendees').select('*')),
  t(sb.from('activity_log').select('*').eq('band_id',b).order('created_at',{ascending:false}).limit(60)),
  t(sb.from('band_members').select('*,profiles(display_name)').eq('band_id',b)),
  t(sb.from('song_files').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('media').select('*').eq('band_id',b).order('created_at',{ascending:false})).catch(()=>[]),
  t(sb.from('draft_files').select('*').eq('band_id',b).order('created_at',{ascending:true})).catch(()=>[])]);
  if(b!==S.bid)return;S.D={songs,drafts,rehs,att,log,mem,files,media,dfiles};draw()}catch(e){toast(err(e))}}
function unsub(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}}
function sub(){unsub();if(!S.bid)return;const b=S.bid,ch=sb.channel('band-'+b+'-'+Date.now());
 const deb=()=>{clearTimeout(S.tm);S.tm=setTimeout(load,250)};
 ['songs','drafts','rehearsals','activity_log','band_members','song_files','media','draft_files'].forEach(table=>ch.on('postgres_changes',{event:'*',schema:'public',table,filter:'band_id=eq.'+b},deb));
 ch.on('postgres_changes',{event:'*',schema:'public',table:'rehearsal_attendees'},deb);
 ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'bands',filter:'id=eq.'+b},()=>{clearTimeout(S.tb);S.tb=setTimeout(loadBands,300)});
 ch.subscribe(s=>{S.sync=s==='SUBSCRIBED'?'ok':'bad';draw()});S.ch=ch}
addEventListener('online',()=>{S.net=true;sub();load();draw()});addEventListener('offline',()=>{S.net=false;draw()});

/* ---------- views ---------- */
async function hydrateSongCovers(){for(const el of document.querySelectorAll('[data-cover-id]')){const id=el.dataset.coverId;if(!id)continue;const f=S.D.files.find(x=>x.id===id);if(!f)continue;try{const r=await sb.storage.from('band-files').createSignedUrl(f.storage_path,3600);if(r.data?.signedUrl)el.innerHTML='<img src="'+r.data.signedUrl+'" alt="Обложка">'}catch(e){}}for(const el of document.querySelectorAll('[data-song-audio]')){const f=S.D.files.find(x=>x.id===el.dataset.songAudio);if(!f)continue;try{const r=await sb.storage.from('band-files').createSignedUrl(f.storage_path,3600);if(r.data?.signedUrl)el.src=r.data.signedUrl}catch(e){}}}
function draw(force){
 const a=document.activeElement;
 if(!force&&S.ma&&S.ma.s===3){S.dirty=true;return}
 if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'){S.dirty=true;return}
 S.dirty=false;
 const el=document.getElementById('app');
 el.innerHTML=S.locked?lockV():!S.cfg?setupV():!S.user?authV():(!S.bands.length||S.gate)?gateV():shellV();
 syncPlay();document.getElementById('pl').style.bottom=S.user&&S.bands.length?'':'0';if(S.user&&S.bands.length)setTimeout(hydrateSongCovers,0)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty)draw()},150));

function setupV(){return`<h1>MusicBandHub</h1><p class=mu>Один раз укажите данные вашего Supabase-проекта (Project Settings → API). Они хранятся только в этом браузере. Используйте только anon/publishable ключ.</p>
<input id=cu placeholder="https://xxxx.supabase.co"><input id=ck placeholder="anon / publishable key"><button data-a=cfg>Сохранить</button>`}
function authV(){return`<div class=logo>${LOGO}<h1>MusicBandHub</h1><p>Твоя музыкальная вселенная</p></div>
<form id=af autocomplete=on><input id=an name=name autocomplete=name placeholder="Имя пользователя" value="${esc(S.f?.n)}"><input id=ae name=email type=email autocomplete=username placeholder="Email" value="${esc(S.f?.e)}"><input id=ap name=password type=password autocomplete=current-password placeholder="Пароль (от 6 символов)">

function parseSig(s){const m=String(s||'4/4').trim().match(/^(\d+)\/(\d+)(?:\s*\(?([\d+]+)\)?)?$/);if(!m)return{n:4,groups:[4],label:'4/4'};const n=+m[1];let g=m[3]?m[3].split('+').map(Number).filter(x=>x>0):(SIGD[m[1]+'/'+m[2]]||[n]);if(g.reduce((a,b)=>a+b,0)!==n)g=[n];return{n,groups:g,label:m[1]+'/'+m[2]+(m[3]?' ('+g.join('+')+')':'')}}
