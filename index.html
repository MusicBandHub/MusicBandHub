<style>
:root{--bg:#07070a;--card:#121216;--sf:#0e0e12;--tx:#f2f2f5;--mu:#8e8e99;--ac:#c6ff1a;--ac2:#c6ff1a;--er:#ff5a6a;--ok:#35e0a1;--bd:#23232c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

h1{font-size:30px;margin:.3em 0}h2{font-size:24px;margin:.5em 0 .2em}h3{font-size:18px;margin:1em 0 .3em}.mu{color:var(--mu);font-size:13px}.er{color:var(--er)}
input,select,textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:5px 0;font:inherit;outline:0}

#eq i:nth-child(2){animation-delay:.15s}#eq i:nth-child(3){animation-delay:.3s}#eq i:nth-child(4){animation-delay:.45s}#eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.mt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#17171d;border:1px solid var(--bd);cursor:pointer}
.mt img,.mt video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .wd{font-size:11px;color:var(--mu);padding:4px 0}.cd{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#15151a;border:1px solid var(--bd);font-size:14px;cursor:pointer}.cd.e{background:transparent;border:0;cursor:default}.cd.t{border-color:var(--ac)}.cd.s{background:var(--ac);color:#0b0b0d;font-weight:800}.cd i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ac)}.cd.s i{background:#0b0b0d}.cm{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.cm b{letter-spacing:1.5px}.cm span{padding:6px 14px;font-size:20px;cursor:pointer}
.mb{display:flex;align-items:center;gap:12px}.mb .pav{cursor:default}.mb .mi{flex:1;min-width:0}.mb .dd{font-size:22px;padding:6px 10px;cursor:pointer;color:var(--mu)}.rb{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#1c1c24;border:1px solid var(--bd)}.rb.OWNER{color:#ffd166}.rb.ADMIN{color:#8bd3ff}.rb.MEMBER{color:var(--mu)}
.mg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.mg2 .mt{border-radius:16px}.mx{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}.pk{display:flex;gap:10px}.pk>div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 6px;text-align:center;cursor:pointer;font-weight:700}.pk>div span{display:block;font-size:30px;margin-bottom:4px}.hn{background:#17171d;border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:10px 0}
.pb{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:var(--ac);border-radius:99px;padding:2px 8px;font-size:12px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qt{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 2px;text-align:center;font-size:12px;cursor:pointer}.qt span{display:block;font-size:24px;margin-bottom:2px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 2px;text-align:center}.sc b{display:block;font-size:24px;color:var(--ac)}.sc span{font-size:11px;color:var(--mu)}
.lg44 svg{width:44px;height:44px;filter:none}.sec{font-size:12px;letter-spacing:1.5px;color:var(--mu);margin:20px 0 6px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end}.sh{background:#121216;border-radius:24px 24px 0 0;width:100%;max-width:720px;margin:0 auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;border:1px solid var(--bd)}
.gi{cursor:pointer}.pav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#c6ff1a);color:#0b0b0d;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
#splash{position:fixed;inset:0;background:#07070a;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s;text-align:center}
#splash svg{width:110px;height:110px;filter:drop-shadow(0 0 18px rgba(124,58,237,.8))}#splash svg path{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .9s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.sp-t{font-weight:800;letter-spacing:6px;font-size:22px;margin-top:14px;line-height:1.15;opacity:0;animation:up .5s .35s forwards}.sp-d{color:var(--ac);letter-spacing:10px;margin:10px 0;opacity:0;animation:up .5s .6s forwards}.sp-b{font-weight:800;letter-spacing:3px;color:var(--mu);opacity:0;animation:up .5s .8s forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#1c1c24;border:1px solid var(--bd)}.b-IDEA{color:#ffd166}.b-DRAFT{color:#8bd3ff}.b-ARRANGEMENT{color:#c4a1ff}.b-READY{color:var(--ok)}.b-ARCHIVED{color:var(--mu)}
.playb{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#0b0b0d;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;cursor:pointer}.sk{width:100%;accent-color:#c6ff1a}input[type=range]{padding:0;border:0;background:transparent;accent-color:#c6ff1a}
.pan{position:fixed;inset:0;z-index:40;background:#0b0b0f;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 40px;display:none}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.dot{width:26px;height:26px;border-radius:50%;background:#222229;border:2px solid #333}.dot.s{border-color:var(--ac)}.dot.on{background:var(--ac);box-shadow:0 0 10px var(--ac)}.gap{width:12px}
.tap{font-size:30px;font-weight:800;padding:26px;border:2px dashed var(--ac);border-radius:20px;color:var(--ac);cursor:pointer;user-select:none;-webkit-user-select:none}

.song-card{position:relative;overflow:hidden;padding:12px;background:linear-gradient(145deg,#14141b,#0e0e12);border-radius:20px;transition:transform .18s,border-color .18s}.song-card:active{transform:scale(.985)}.song-cover{width:76px;height:76px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#7c3aed,#c6ff1a);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;box-shadow:0 8px 25px rgba(0,0,0,.35)}.song-cover img{width:100%;height:100%;object-fit:cover;border-radius:16px}.song-meta{min-width:0;flex:1}.song-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-play{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#0b0b0d;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;flex:none}.song-hero{border-radius:24px;padding:20px 16px;background:radial-gradient(circle at 50% 0,#5b21b6 0,#17121f 48%,#101014 100%);border:1px solid #39304d;text-align:center;margin:8px 0 14px}.song-hero-cover{width:min(72vw,260px);aspect-ratio:1;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,#7c3aed,#34e0a1,#c6ff1a);display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 18px 45px rgba(0,0,0,.45);overflow:hidden}.song-hero-cover img{width:100%;height:100%;object-fit:cover}.song-hero h2{margin:4px 0;font-size:26px}.song-player{background:#0d0d12;border:1px solid #2b2b35;border-radius:18px;padding:10px;margin-top:14px}.song-player audio{width:100%;height:42px}.song-stats{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}.song-stat{background:#191920;border:1px solid #2b2b35;border-radius:99px;padding:6px 10px;font-size:12px;color:var(--mu)}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dash .sc{min-height:72px}.activity{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.ai-card{background:radial-gradient(circle at 100% 0,#3b1a72,#15151b 55%,#101014);border:1px solid #4a356d}.ai-q{display:flex;flex-wrap:wrap;gap:6px}.ai-q .chip{margin:0}.meter{height:7px;background:#24242c;border-radius:99px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#34e0a1,#8b5cf6);border-radius:99px}@media(max-width:420px){.dash{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<div id="splash"></div>
<div id="app"></div>
<div id="pl"><div style="display:flex;align-items:center;gap:8px"><div id="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="mu" id="pt"></div></div><audio id="au" controls></audio></div>
<div id="mo" class="pan"></div><div id="ro" class="pan"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const v=id=>document.getElementById(id)?.value??'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRESET={url:'https://jgzzdsittnzomedvsspj.supabase.co',key:'sb_publishable_z40zmd4oAy9jUr3Q4BgDYQ_-IpiIlJe'}; // можно вписать Project URL и anon key, чтобы экран настройки не показывался
let sb=null,S={cfg:(PRESET.url&&PRESET.key)?PRESET:JSON.parse(localStorage.mbh_cfg||'null'),user:null,invAll:[],bands:[],bid:localStorage.mbh_band||null,tab:'home',song:null,reg:false,msg:'',net:navigator.onLine,sync:'',created:null,busy:false,q:'',fs:'',D:{songs:[],drafts:[],rehs:[],att:[],log:[],mem:[],files:[]}};
const ST=['IDEA','DRAFT','ARRANGEMENT','READY','ARCHIVED'],AL={GOING:'Буду',MAYBE:'Возможно',NOT_GOING:'Не смогу'};
const OK_EXT=['mp3','wav','m4a','ogg','gp','gp5','pdf','txt','png','jpg','jpeg','mp4'];

const LOGO=`<svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c6ff1a"/><stop offset=".55" stop-color="#34e0a1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M6 46 L18 14 L32 40 L46 14 L58 46" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g stroke="url(#lg)" stroke-width="3" stroke-linecap="round"><path d="M2 32v6M10 26v16M54 26v16M62 32v6"/></g></svg>`;
const IC={home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',songs:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',drafts:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',rehs:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',files:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',media:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',mem:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function err(e){const m=(e&&e.message)||String(e);
 if(!navigator.onLine||/fetch|network/i.test(m))return'Нет соединения';
 if(/invalid_invite_code/.test(m))return'Неверный код группы';
 if(/already_member/.test(m))return'Вы уже состоите в этой группе';
 if(/Invalid login/i.test(m))return'Неверный email или пароль';
 if(/already registered/i.test(m))return'Этот email уже зарегистрирован';
 if(/JWT|expired/i.test(m))return'Сессия истекла, войдите снова';
 if(/check constraint/i.test(m))return'Недопустимое значение';
 if(/row-level security/i.test(m))return'Недостаточно прав';
 return'Ошибка: '+m.slice(0,80)}
const nm=id=>S.D.mem.find(m=>m.user_id===id)?.profiles?.display_name||'—';
const band=()=>S.bands.find(b=>b.id===S.bid);
const myRole=()=>S.D.mem.find(m=>m.user_id===S.user?.id)?.role;
const isAdm=()=>['OWNER','ADMIN'].includes(myRole());
const dt=s=>(s||'').slice(0,16).replace('T',' ');
function desc(a){const w=nm(a.user_id),n=a.new_value||'';
 return({'song.created':`${w} добавил песню «${n}»`,'song.bpm_changed':`${w} изменил BPM: ${a.old_value} → ${n}`,'song.lyrics_changed':`${w} изменил текст`,'song.chords_changed':`${w} изменил аккорды`,'song.status_changed':`${w} изменил статус: ${a.old_value} → ${n}`,'media.media_added':`${w} добавил в медиа: ${n}`,'file.file_added':`${w} добавил файл: ${n}`,'rehearsal.created':`${w} создал репетицию ${n}`,'rehearsal.updated':`${w} изменил репетицию ${n}`,'member.joined':`${w} вступил в группу`})[a.entity_type+'.'+a.action]||`${w}: ${a.action}`}

/* ---------- data ---------- */
const t=q=>q.then(r=>{if(r.error)throw r.error;return r.data});
async function loadInv(){try{S.invAll=await t(sb.from('invitations').select('*').order('created_at',{ascending:false}));try{S.reqs=await t(sb.from('join_requests').select('*'))}catch(e){S.reqs=[]}draw()}catch(e){}}
function subInv(){unsubInv();if(!S.user)return;S.ich=sb.channel('inv-'+S.user.id+'-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'invitations'},()=>{clearTimeout(S.ti);S.ti=setTimeout(loadInv,250)}).on('postgres_changes',{event:'*',schema:'public',table:'join_requests'},()=>{clearTimeout(S.tr);S.tr=setTimeout(loadBands,400)}).subscribe()}
function unsubInv(){if(S.ich){sb.removeChannel(S.ich);S.ich=null}}
const myEmail=()=>(S.user?.email||'').toLowerCase();
function invBanner(){return S.invAll.filter(x=>x.email===myEmail()).map(i=>`<div class=card style="border:1px solid var(--ac)"><b>Приглашение в группу «${esc(i.band_name)}»</b><div class=mu>от ${esc(i.inviter_name)} · Роль: Участник</div><div class=row><button class=s data-a=accept data-id=${i.id}>Принять</button><button class="s g" data-a=decline data-id=${i.id}>Отклонить</button></div></div>`).join('')}
async function loadBands(){
 try{subInv();await loadInv();const r=await t(sb.from('band_members').select('role,bands(*)').eq('user_id',S.user.id));
  S.bands=r.map(x=>x.bands).filter(Boolean);S.roles={};r.forEach(x=>{if(x.bands)S.roles[x.bands.id]=x.role});
  if(S.bands.length&&!band()){S.bid=S.bands[0].id;localStorage.mbh_band=S.bid}
  if(!S.bands.length)S.bid=null;try{localStorage.mbh_bn=band()?.name||''}catch(e){}
  sub();await load()}catch(e){S.msg=err(e)}
 draw(true)}
async function load(){const b=S.bid;if(!b)return;
 try{const[songs,drafts,rehs,att,log,mem,files,media,dfiles]=await Promise.all([
  t(sb.from('songs').select('*').eq('band_id',b).order('updated_at',{ascending:false})),
  t(sb.from('drafts').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('rehearsals').select('*').eq('band_id',b).order('date')),
  t(sb.from('rehearsal_attendees').select('*')),
  t(sb.from('activity_log').select('*').eq('band_id',b).order('created_at',{ascending:false}).limit(60)),
  t(sb.from('band_members').select('*,profiles(display_name)').eq('band_id',b)),
  t(sb.from('song_files').select('*').eq('band_id',b).order('created_at',{ascending:false})),
  t(sb.from('media').select('*').eq('band_id',b).order('created_at',{ascending:false})).catch(()=>[]),
  t(sb.from('draft_files').select('*').eq('band_id',b).order('created_at',{ascending:true})).catch(()=>[])]);
  if(b!==S.bid)return;S.D={songs,drafts,rehs,att,log,mem,files,media,dfiles};draw()}catch(e){toast(err(e))}}
function unsub(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}}
function sub(){unsub();if(!S.bid)return;const b=S.bid,ch=sb.channel('band-'+b+'-'+Date.now());
 const deb=()=>{clearTimeout(S.tm);S.tm=setTimeout(load,250)};

const SIGD={'2/4':[2],'3/4':[3],'4/4':[4],'5/4':[3,2],'6/8':[3,3],'7/8':[2,2,3],'9/8':[3,3,3],'12/8':[3,3,3,3]};
function parseSig(s){const m=String(s||'4/4').trim().match(/^(\d+)\/(\d+)(?:\s*\(?([\d+]+)\)?)?$/);if(!m)return{n:4,groups:[4],label:'4/4'};const n=+m[1];let g=m[3]?m[3].split('+').map(Number).filter(x=>x>0):(SIGD[m[1]+'/'+m[2]]||[n]);if(g.reduce((a,b)=>a+b,0)!==n)g=[n];return{n,groups:g,label:m[1]+'/'+m[2]+(m[3]?' ('+g.join('+')+')':'')}}
const MET={bpm:120,sig:'4/4',accent:'first',sound:'click',run:false,song:null,i:0,next:0,id:null,tap:null,taps:[]};let AC=null;
function mClick(t,l){const o=AC.createOscillator(),g=AC.createGain(),d=MET.sound==='click'?.03:MET.sound==='wood'?.06:.09;o.frequency.value=[900,1250,1700][l];o.type=MET.sound==='click'?'square':MET.sound==='wood'?'triangle':'sine';g.gain.setValueAtTime(l?.9:.55,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function mLevel(i,p){const m=MET.accent;if(m==='none')return 0;if(i===0)return 2;if(m==='first')return 0;if(m==='two')return(p.n>=4&&i===Math.floor(p.n/2))?1:0;if(m==='groups'){let s=0;for(const g of p.groups){if(i===s)return 1;s+=g}}return 0}
function mBeat(i){document.querySelectorAll('#md .dot').forEach(d=>d.classList.toggle('on',+d.dataset.i===i))}
function mTick(){const p=parseSig(MET.sig),spb=60/MET.bpm;while(MET.next<AC.currentTime+.12){const i=MET.i%p.n;mClick(MET.next,mLevel(i,p));setTimeout(()=>mBeat(i),Math.max(0,(MET.next-AC.currentTime)*1000));MET.next+=spb;MET.i++}}
function mStart(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();MET.i=0;MET.next=AC.currentTime+.08;clearInterval(MET.id);MET.id=setInterval(mTick,25);MET.run=true;const b=document.getElementById('mt');if(b)b.textContent='■ Стоп'}
function mStop(){clearInterval(MET.id);MET.run=false;const b=document.getElementById('mt');if(b)b.textContent='▶ Запустить';mBeat(-1)}
function mSetBpm(v){MET.bpm=Math.max(20,Math.min(300,Math.round(v)||120));['mb'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=MET.bpm});const r=document.getElementById('mrg');if(r)r.value=MET.bpm;const n=document.getElementById('mbi');if(n)n.value=MET.bpm}
function mLoad(song){MET.song=song||null;const s=song&&S.D.songs.find(x=>x.id===song);if(s){if(s.bpm)MET.bpm=s.bpm;if(s.time_signature)MET.sig=s.time_signature}}
function dotsHtml(p){let h='',i=0;p.groups.forEach((g,gi)=>{if(gi)h+='<span class=gap></span>';for(let k=0;k<g;k++,i++)h+=`<span class="dot ${mLevel(i,p)?'s':''}" data-i=${i}></span>`});return h}

 document.getElementById('mo').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>🥁 Метроном</h2><button class="g s" data-m=close>✕</button></div>

const MA={close(){mClose()},bpm(d){mSetBpm(MET.bpm+ +d.d)},toggle(){MET.run?mStop():mStart()},
